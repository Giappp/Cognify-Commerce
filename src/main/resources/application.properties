spring.config.import=optional:file:.env[.properties]
spring.application.name=CognifyCommerce
server.port=8080
server.shutdown=graceful
# Database Configuration
spring.datasource.url=${DB_URL}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
# Flyway Configuration
spring.modulith.runtime.flyway-enabled=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Show SQL statements in the console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Redis Configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
# Caching (Optional but recommended)
spring.cache.type=redis
# Actuator Endpoints
management.endpoints.web.exposure.include=health, modulith
# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.accessTokenExpirationMs=${JWT_EXPIRATION_MS}